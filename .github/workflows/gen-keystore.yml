name: Generate Keystore (sekali)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate release keystore
        run: |
          STORE_PASS="Qur4nAbbs!2026#R3l3as3"
          KEY_PASS="Qur4nAbbs!2026#R3l3as3"
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias quran \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Al-Qur'an Digital, OU=IT, O=SMP ABBS Surakarta, L=Surakarta, ST=Jawa Tengah, C=ID" \
            -ext "SAN=dns:alquran.sch.id"

      - name: Encode base64
        run: |
          base64 -w0 release.jks > release.jks.b64
          echo "size=$(wc -c < release.jks)" >> $GITHUB_ENV
          echo "size64=$(wc -c < release.jks.b64)" >> $GITHUB_ENV
          echo "keystore ada: $(ls -la release.jks | awk '{print $5}') bytes"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
          if-no-files-found: error
